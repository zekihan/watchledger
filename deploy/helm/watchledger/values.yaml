replicaCount: 1
image:
  repository: ghcr.io/zekihan/watchledger
  tag: "0.1.4"
  pullPolicy: IfNotPresent
# Create this Secret separately. No credentials belong in chart values.
existingSecret: ""
publicURL: ""
oidc:
  issuer: ""
  clientID: watchledger
  extraScopes: ""
  claimsSource: auto
  admissionClaim: groups
  admissionValue: watchledger-users
  adminClaim: groups
  adminValue: watchledger-admins
service:
  port: 8080
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Public registered HTTP client identity, not an account password.
anidb:
  client: ""
  version: 1
