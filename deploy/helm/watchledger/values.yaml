replicaCount: 1
image:
  repository: watchledger
  tag: "0.1.0-dev"
  pullPolicy: IfNotPresent
# Create this Secret separately. No credentials belong in chart values.
existingSecret: ""
publicURL: ""
oidc:
  issuer: ""
  clientID: watchledger
  admissionClaim: groups
  admissionValue: watchledger-users
  adminClaim: groups
  adminValue: watchledger-admins
service:
  port: 8080
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
