services:
  app:
    image: ghcr.io/zekihan/watchledger:0.1.0
    build:
      context: ..
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WATCHLEDGER_ADDR: 0.0.0.0:8080
      WATCHLEDGER_WEB_DIR: /app/web
      DATABASE_URL: ${DATABASE_URL:?Set an external PostgreSQL connection string}
      PUBLIC_URL: ${PUBLIC_URL:?Set the public URL}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set the OIDC issuer}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set the OIDC client ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_EXTRA_SCOPES: ${OIDC_EXTRA_SCOPES:-}
      OIDC_CLAIMS_SOURCE: ${OIDC_CLAIMS_SOURCE:-auto}
      OIDC_ADMISSION_CLAIM: ${OIDC_ADMISSION_CLAIM:?Set admission claim}
      OIDC_ADMISSION_VALUE: ${OIDC_ADMISSION_VALUE:?Set admission value}
      OIDC_ADMIN_CLAIM: ${OIDC_ADMIN_CLAIM:?Set admin claim}
      OIDC_ADMIN_VALUE: ${OIDC_ADMIN_VALUE:?Set admin value}
      SESSION_KEY: ${SESSION_KEY:?Set base64 session encryption key}
      TMDB_TOKEN: ${TMDB_TOKEN:-}
      ANIDB_CLIENT: ${ANIDB_CLIENT:-}
      ANIDB_CLIENT_VERSION: ${ANIDB_CLIENT_VERSION:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
