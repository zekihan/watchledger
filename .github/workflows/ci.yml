name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: watchledger
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: watchledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchledger -d watchledger_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WATCHLEDGER_TEST_BROWSER: ${{ matrix.browser }}
      TEST_DATABASE_URL: postgres://watchledger:synthetic-test-only@localhost:5432/watchledger_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Audit dependency advisories
        if: matrix.browser == 'chromium'
        run: |
          npm audit --audit-level=high
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./cmd/... ./internal/...
      - run: make lint-web lint-docs format-check test test-race build
      - run: git diff --exit-code
      - name: Install selected browser for synthetic acceptance
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build application container
        run: docker build -t watchledger:ci .
      - name: Smoke test Compose startup, OIDC and restart persistence
        run: bash scripts/compose-smoke.sh
      - name: Preserve synthetic browser screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: synthetic-browser-screenshots-${{ matrix.browser }}
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate Helm chart
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz -o /tmp/helm.tar.gz
          curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum -o /tmp/helm.sha256
          cd /tmp && mv helm.tar.gz helm-v3.19.0-linux-amd64.tar.gz && sha256sum -c helm.sha256
          tar -xzf helm-v3.19.0-linux-amd64.tar.gz
          cd "$GITHUB_WORKSPACE"
          /tmp/linux-amd64/helm lint deploy/helm/watchledger --set existingSecret=fixture --set publicURL=https://watch.example --set oidc.issuer=https://identity.example
          /tmp/linux-amd64/helm template watchledger deploy/helm/watchledger --set existingSecret=fixture --set publicURL=https://watch.example --set oidc.issuer=https://identity.example > /tmp/rendered.yaml
